<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Noticias</title>
</head>
<body>
    <div class="container py-4">
        {% for news in newss %}
            <div class="card mb-4 shadow-sm border-0 rounded-4 overflow-hidden" style="max-width: 900px;">
                <div class="row g-0 align-items-center">
                    <div class="col-md-4">
                        <div class="h-100 bg-light d-flex align-items-center justify-content-center p-3">
                            <div class="bg-primary-subtle text-primary fw-bold rounded-circle d-flex align-items-center justify-content-center" style="width: 90px; height: 90px; font-size: 1.5rem;">
                                Noticia
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card-body p-4">
                            <span class="badge bg-primary-subtle text-primary mb-2">Noticias</span>
                            <h5 class="card-title fw-bold mb-3">{{ news.headline }}</h5>
                            <p class="card-text text-muted mb-3">{{ news.body }}</p>
                            <p class="card-text mb-0">
                                <small class="text-secondary">{{ news.date }}</small>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
