<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<h1>Bienvenido a la página principal, {{ name }}</h1>
<h2>Esta es la página principal completa</h2>

<div class="container">
    <form action="">
        <div class="mb-3">
            <label for="searchMovie" class="form-label">
                Search for a movie:
            </label>
            <input type="text" id="searchMovie" class="form-control" name="searchMovie">
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <p>Searching for {{searchTerm}}</p>
        {% for movie in movies %}
            <div class="movie">
                <h3>{{ movie.title }}</h3>
                <p>{{ movie.description }}</p>
                <img src="{{ movie.image.url }}" alt="{{ movie.title }}">
                {% if movie.url %}
                    <a href="{{ movie.url }}">More info</a>
                {% endif %}
            </div>
        {% endfor %}
</div>
