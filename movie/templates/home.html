<head>
    <title>Movie Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<h1>Bienvenido a la página principal, {{ name }}</h1>
<h2>Esta es la página principal completa</h2>

<div class="container">
    <form action="">
        <div class="mb-3">
            <label for="searchMovie" class="form-label">
                Search for a movie:
            </label>
            <input type="text" id="searchMovie" class="form-control" name="searchMovie">
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <p>Searching for {{searchTerm}}</p>

    
    <div class="row row-cols-1 row-cols-md-3 g-4">

        {% for movie in movies %}
            <div class="col">   
                <div class="card">
                    <img src="{{ movie.image.url }}" class="card-img-top" alt="{{ movie.title }}">
                    <div class="card-body">
                        <h5 class="card-title fw-bold"> {{ movie.title }} </h5>
                        <p class="card-text"> {{ movie.description }} </p>
                        <p class="card-text">{{ movie.genre }}</p>
                        <p class="card-text"> {{ movie.year }} </p>
                        {% if movie.url %}
                            <a href="{{ movie.url }}" class="btn btn-primary">Movie Link</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
